name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTS=ON
          -DUSE_SANITIZERS=OFF
          -DBUILD_FULL_BROWSER=OFF

      - name: Build network
        run: cmake --build build --target network network_url_test style_test -- -j 2

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
